<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>여행일지</title>
<style>
:root{
  --sky:#C9E2F2; --sky-deep:#A9CFE6; --paper:#EDF5FA; --card:#fff;
  --navy:#1B4E96; --navy-deep:#123566; --ink:#1C2A38; --ink-soft:#41535F; --muted:#6F8496;
  --rule:#3C4E5C; --line:#C4D8E5; --line-soft:#DCE9F2;
  --stay:#2F6FB5; --food:#D2691E; --sight:#2E8B6E; --cafe:#7A5AA8; --etc:#6B7280;
  --font:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font);line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.app{max-width:900px;margin:0 auto;padding:0 18px 120px}

.topbar{position:sticky;top:0;z-index:40;background:rgba(237,245,250,.94);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);margin:0 -18px 22px;padding:13px 18px;display:flex;align-items:center;gap:12px}
.brand h1{font-size:19px;font-weight:800;letter-spacing:-.05em;margin:0;color:var(--navy-deep)}
body.home .brand h1{font-size:16px}
body.home .brand .tag{display:none}
.brand .tag{font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.08em}
.topbar .spacer{flex:1}

.btn{border:1px solid var(--navy);background:var(--navy);color:#fff;border-radius:999px;padding:9px 16px;font-size:14px;font-weight:700;letter-spacing:-.02em;transition:transform .12s}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:#fff;color:var(--navy);border-color:var(--line)}
.btn.ghost[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.danger{background:#fff;border-color:#E0BDBD;color:#B4483A}
.icon-btn{border:1px solid var(--line);background:#fff;border-radius:9px;width:32px;height:32px;display:grid;place-items:center;font-size:14px;color:var(--ink-soft)}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:10px;margin:0 0 14px}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--line)}

/* 목록 */
.yeargroup{margin-bottom:26px}
.yearhead{display:flex;align-items:center;gap:9px;margin:0 0 12px;font-size:15px;font-weight:800;
  letter-spacing:-.03em;color:var(--navy-deep)}
.yearhead span{font-family:var(--mono);font-size:11px;font-weight:400;color:var(--muted);
  border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.yearhead::after{content:"";flex:1;height:1px;background:var(--line)}
.hero{position:relative;margin:0 -18px 24px;overflow:hidden;background:#DCEAF4}
.hero img{display:block;width:100%;height:auto}
@media(min-width:940px){.hero{margin:0 0 24px;border-radius:16px;box-shadow:0 10px 30px rgba(18,53,102,.14)}}
.hero .scrollcue{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:12px;color:var(--navy-deep);opacity:.75;pointer-events:none}
.trip-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:14px}
.trip-card{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--card);text-align:left;padding:0;width:100%;transition:transform .14s,box-shadow .14s}
.trip-card:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(18,53,102,.12)}
.mini-cover{height:108px;background:var(--sky);position:relative;overflow:hidden}
.mini-cover img{position:absolute;width:60%;height:74px;object-fit:cover;background:#fff;padding:4px;border-radius:2px;box-shadow:0 4px 10px rgba(18,53,102,.22)}
.mini-cover img:nth-child(1){left:5%;top:10px;transform:rotate(-4deg)}
.mini-cover img:nth-child(2){right:4%;top:24px;transform:rotate(4deg);width:52%}
.mini-cover .noimg{position:absolute;inset:0;display:grid;place-items:center;color:var(--navy-deep);opacity:.4;font-size:12.5px}
.trip-body{padding:12px 14px 14px}
.trip-body h3{margin:0 0 3px;font-size:17px;font-weight:800;letter-spacing:-.04em;color:var(--navy-deep)}
.trip-meta{font-family:var(--mono);font-size:11px;color:var(--muted)}
.trip-stats{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.pillstat{font-size:11.5px;border:1px solid var(--line-soft);border-radius:999px;padding:2px 9px;color:var(--ink-soft);background:var(--paper)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:36px 22px;text-align:center;background:var(--card)}
.empty strong{display:block;font-size:17px;font-weight:800;letter-spacing:-.03em;margin-bottom:6px;color:var(--navy-deep)}
.empty p{margin:0 0 16px;color:var(--muted);font-size:14.5px}

.backlink{background:none;border:0;padding:0;font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;color:var(--muted);margin-bottom:12px}
.head-actions{display:flex;gap:8px;margin:16px 0 0;flex-wrap:wrap}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:20px 0 22px;position:sticky;top:61px;background:var(--paper);z-index:20;overflow-x:auto}
.tab{background:none;border:0;padding:11px 13px;font-size:14.5px;font-weight:700;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;letter-spacing:-.03em;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--navy);border-bottom-color:var(--navy)}

/* ============ 지면(페이지) ============ */
.pagebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.pagebar .grow{flex:1}
.pagehint{font-size:12.5px;color:var(--muted);margin:0 0 14px}
.pagewrap{display:grid;gap:22px}
.page{position:relative;width:100%;padding-top:141.4%;background:var(--sky);border-radius:5px;
  box-shadow:0 6px 22px rgba(18,53,102,.16);overflow:hidden;user-select:none}
.page .inner{position:absolute;inset:0}
.pnum{position:absolute;bottom:1.4%;right:3%;font-family:var(--mono);font-size:.5em;color:var(--navy-deep);opacity:.5}
.pitem{position:absolute;transform-origin:center center}
.pitem.photo figure{margin:0;background:#fff;padding:.28em .28em .28em;border-radius:2px;box-shadow:0 .18em .5em rgba(18,53,102,.25)}
.pitem.photo img{width:100%;display:block;border-radius:1px}
.pitem.photo figcaption{font-size:.56em;line-height:1.5;color:#26384A;padding:.5em .2em 0;white-space:pre-wrap}
.pitem.text{font-size:.66em;line-height:1.62;color:#22323F;white-space:pre-wrap}
.pitem.title{font-size:1.35em;font-weight:900;letter-spacing:-.05em;color:var(--navy);line-height:1.15}
.pitem.title .dsub{display:block;font-size:.42em;font-weight:700;letter-spacing:0;color:var(--navy-deep);opacity:.72;margin-top:.5em}
.pitem.course{font-size:.6em;font-weight:700;color:var(--navy-deep);background:rgba(255,255,255,.72);border-radius:.5em;padding:.6em .8em;line-height:1.7}
.pitem.course b{display:block;font-size:.85em;opacity:.65;margin-bottom:.25em;letter-spacing:.04em}
.editing .pitem{cursor:grab;touch-action:none}
.editing .pitem::after{content:"";position:absolute;inset:-4px;border:1px dashed rgba(27,78,150,.35);border-radius:4px;pointer-events:none}
.editing .pitem.sel::after{border:2px solid var(--navy);background:rgba(27,78,150,.06)}
.phandle{display:none;position:absolute;width:30px;height:30px;border-radius:50%;background:var(--navy);
  border:2px solid #fff;box-shadow:0 2px 8px rgba(18,53,102,.4);z-index:99;touch-action:none;
  align-items:center;justify-content:center;color:#fff;font-size:13px;line-height:1}
.editing .pitem.sel .phandle{display:flex}
.phandle.h-size{right:-15px;bottom:-15px;cursor:nwse-resize}
.phandle.h-rot{right:-15px;top:-15px;cursor:grab}
.itembar{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:60;background:var(--navy-deep);
  border-radius:999px;padding:6px;display:flex;gap:4px;box-shadow:0 8px 22px rgba(18,53,102,.35);
  max-width:min(94vw,760px);overflow-x:auto;scrollbar-width:none}
.itembar::-webkit-scrollbar{display:none}
.itembar button{white-space:nowrap;flex:0 0 auto}
.itembar button{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700}
.itembar button:hover{background:rgba(255,255,255,.28)}

/* 표지 지면 */
.coverpage{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:6%}
.coverpage .collage{position:relative;width:100%;height:38%;margin-bottom:2%}
.coverpage figure{position:absolute;margin:0;background:#fff;padding:.3em;border-radius:2px;box-shadow:0 .2em .5em rgba(18,53,102,.25)}
.coverpage figure img{width:100%;height:100%;object-fit:cover;display:block}
.coverpage .c1{width:52%;height:56%;left:2%;top:2%;transform:rotate(-4.5deg)}
.coverpage .c2{width:47%;height:52%;right:1%;top:22%;transform:rotate(3.5deg)}
.coverpage .c3{width:46%;height:50%;left:7%;bottom:0;transform:rotate(-2deg)}
.coverpage .rule{height:.11em;background:var(--rule);width:78%;margin:.9em auto}
.coverpage .date{font-size:.7em;font-weight:700;color:var(--navy-deep)}
.coverpage h2{margin:.25em 0 .1em;font-size:2.3em;font-weight:900;letter-spacing:-.055em;color:var(--navy);text-shadow:.04em .06em 0 rgba(255,255,255,.75)}
.coverpage .region{margin:0;font-size:1.15em;font-weight:800;color:var(--navy);letter-spacing:-.04em}
.coverpage .party{margin:.8em 0 0;font-size:1em;font-weight:800;color:var(--navy-deep);letter-spacing:-.03em;white-space:pre-line;line-height:1.4}

/* ============ 여정(목록) ============ */
.note-block{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--navy);border-radius:0 var(--r) var(--r) 0;padding:15px 17px;margin-bottom:20px}
.note-block h5{margin:0 0 7px;font-size:13px;font-weight:800;color:var(--navy)}
.note-block p{margin:0;white-space:pre-wrap;font-size:14.5px;color:var(--ink-soft)}
.timeline{position:relative;padding-left:70px}
.timeline::before{content:"";position:absolute;left:53px;top:8px;bottom:8px;width:1px;background:var(--line)}
.day{position:relative;margin-bottom:22px}
.daystamp{position:absolute;left:-70px;top:2px;width:62px;text-align:right;font-family:var(--mono);font-size:10.5px;color:var(--muted);line-height:1.35}
.daystamp b{display:block;font-size:14px;color:var(--navy-deep);font-weight:800}
.daystamp .dn{display:block;font-size:19px;color:var(--ink);font-weight:700}
.day::before{content:"";position:absolute;left:-18px;top:10px;width:9px;height:9px;border-radius:50%;background:var(--paper);border:2px solid var(--navy)}
.entry{border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:14px 15px}
.entry h4{margin:0 0 6px;font-size:16.5px;font-weight:800;letter-spacing:-.04em;color:var(--navy-deep)}
.entry p.body{margin:0;white-space:pre-wrap;font-size:14.5px;color:var(--ink-soft)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chip{font-size:12px;background:var(--paper);border:1px solid var(--line-soft);border-radius:999px;padding:2px 9px;color:var(--ink-soft)}
.entry-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.entry-actions{display:flex;gap:4px;flex-shrink:0}
.course{background:var(--sky);border-radius:10px;padding:10px 12px;margin:0 0 11px}
.course .clabel{font-size:11px;font-weight:800;color:var(--navy-deep);margin-bottom:5px}
.course .flow{display:flex;flex-wrap:wrap;align-items:center;gap:5px}
.course .step{background:#fff;border-radius:7px;padding:3px 9px;font-size:13px;font-weight:700;color:var(--navy-deep)}
.course .arw{color:var(--navy);font-weight:800;font-size:13px}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:9px;margin-top:12px}
.shot{background:var(--paper);border:1px solid var(--line-soft);border-radius:10px;overflow:hidden;padding:0;text-align:left;width:100%}
.shot img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:#fff}
.shot figcaption{padding:6px 8px 8px;font-size:12px;line-height:1.45;color:var(--ink-soft);white-space:pre-wrap}
.shot.more{display:grid;place-items:center;min-height:110px;border-style:dashed;color:var(--muted);font-size:12.5px;text-align:center}

/* 장소 */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.filter{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;color:var(--ink-soft)}
.filter[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700}
.place-list{display:grid;gap:10px}
.place{display:flex;gap:12px;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:13px 14px;align-items:flex-start}
.dot{width:10px;height:10px;border-radius:50%;margin-top:8px;flex-shrink:0}
.place-main{flex:1;min-width:0}
.place h4{margin:0;font-size:16px;font-weight:800;letter-spacing:-.04em;display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--navy-deep)}
.cat-label{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.place .note{margin:5px 0 0;font-size:14px;color:var(--ink-soft);white-space:pre-wrap}
.place .geo{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:6px}
.stars{letter-spacing:2px;font-size:13px;color:#D9A21B}

/* 지도 */
#map{height:420px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--card);z-index:1}
.map-note{font-size:12.5px;color:var(--muted);margin:10px 2px 0}
.map-bar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.pin{width:20px;height:20px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.fallmap{width:100%;height:420px;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
.fallmap text{font-family:var(--mono);font-size:9px;fill:var(--muted)}

/* 모달 */
.overlay{position:fixed;inset:0;background:rgba(18,53,102,.5);z-index:100;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:640px){.overlay{align-items:center;padding:24px}}
.sheet{background:var(--paper);width:100%;max-width:580px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:20px 18px 26px;border:1px solid var(--line)}
@media(min-width:640px){.sheet{border-radius:18px}}
.sheet h3{margin:0 0 16px;font-size:20px;font-weight:800;letter-spacing:-.04em;color:var(--navy-deep)}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:6px}
.field input[type=text],.field input[type=date],.field input[type=number],.field textarea,.field select{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px}
.field textarea{min-height:110px;resize:vertical;line-height:1.6}
.field .hint{font-size:12px;color:var(--muted);margin-top:5px}
.row{display:flex;gap:10px}.row>*{flex:1}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opt{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13.5px}
.opt[aria-pressed="true"]{border-color:var(--navy);background:var(--navy);color:#fff;font-weight:700}
.sheet-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.filedrop{display:block;border:1px dashed var(--line);border-radius:10px;padding:14px;text-align:center;background:#fff;font-size:13.5px;color:var(--muted)}
.pvlist{display:grid;gap:8px;margin-top:10px}
.pvrow{display:flex;gap:9px;align-items:center;background:#fff;border:1px solid var(--line-soft);border-radius:10px;padding:7px}
.pvrow img{width:62px;height:62px;object-fit:cover;border-radius:7px;flex-shrink:0}
.pvrow input{flex:1;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;min-width:0}
.pvrow button{border:1px solid var(--line);background:#fff;border-radius:8px;width:30px;height:30px;flex-shrink:0}

.lb{position:fixed;inset:0;background:rgba(10,20,32,.95);z-index:200;display:grid;place-items:center;padding:16px}
.lb img{max-width:100%;max-height:74vh;border-radius:6px}
.lb .cap{max-width:640px;text-align:center;color:#DCE9F2;font-size:14px;margin-top:14px;white-space:pre-wrap}
.lb .lbbar{position:absolute;top:14px;right:14px}
.lb .nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.15);border:0;color:#fff;width:44px;height:64px;border-radius:10px;font-size:20px}
.lb .prev{left:12px}.lb .next{right:12px}
.lb .count{position:absolute;bottom:18px;font-family:var(--mono);font-size:12px;color:#9FB6C8}

#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--navy-deep);color:#fff;padding:9px 16px;border-radius:999px;font-size:13.5px;box-shadow:0 6px 18px rgba(18,53,102,.3)}
.fab{position:fixed;right:max(18px,calc(50% - 450px + 18px));bottom:22px;z-index:50;box-shadow:0 8px 20px rgba(18,53,102,.25)}
.footnote{margin-top:34px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}

@media print{
  @page{size:A4;margin:0}
  body{background:#fff}
  .topbar,.tabs,.head-actions,.backlink,.fab,.footnote,#toast,.pagebar,.pagehint,.itembar{display:none!important}
  .app{padding:0;max-width:none}
  .pagewrap{gap:0}
  .page{box-shadow:none;border-radius:0;break-after:page;page-break-after:always}
  .editing .pitem::after{display:none}
}
</style>

<div class="app">
  <header class="topbar">
    <div class="brand"><h1>여행일지</h1><div class="tag">TRAVEL JOURNAL</div></div>
    <div class="spacer"></div>
    <button class="btn ghost sm" data-act="menu">데이터</button>
  </header>
  <main id="view"></main>
  <div class="footnote" id="footnote"></div>
</div>
<div id="modal-root"></div><div id="lb-root"></div><div id="toast"></div><div id="bar-root"></div>

<script>
/* ============ 저장소 ============ */
/* Claude 안에서는 Claude 저장소를, 웹·기기에서는 이 기기의 저장소(IndexedDB)를 쓴다 */
if(!window.storage && window.indexedDB){
  const DB='travel-journal', ST='kv';
  const openDB=()=>new Promise((res,rej)=>{
    const r=indexedDB.open(DB,1);
    r.onupgradeneeded=()=>{ if(!r.result.objectStoreNames.contains(ST)) r.result.createObjectStore(ST); };
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
  const run=(mode,fn)=>openDB().then(db=>new Promise((res,rej)=>{
    const t=db.transaction(ST,mode), req=fn(t.objectStore(ST));
    t.oncomplete=()=>res(req?req.result:undefined);
    t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error);
  }));
  window.storage={
    async get(k){ const v=await run('readonly',s=>s.get(k)); if(v===undefined) throw new Error('none'); return {key:k,value:v}; },
    async set(k,v){ await run('readwrite',s=>s.put(v,k)); return {key:k,value:v}; },
    async delete(k){ await run('readwrite',s=>s.delete(k)); return {key:k,deleted:true}; },
    async list(p=''){ const ks=await run('readonly',s=>s.getAllKeys()); return {keys:(ks||[]).map(String).filter(k=>k.startsWith(p))}; }
  };
  window.__deviceStore=true;
}
if(!window.storage){
  const mem={};
  window.storage={async get(k){if(!(k in mem))throw 0;return{key:k,value:mem[k]}},
    async set(k,v){mem[k]=v;return{key:k,value:v}},async delete(k){delete mem[k];return{key:k,deleted:1}},
    async list(p=''){return{keys:Object.keys(mem).filter(k=>k.startsWith(p))}}};
  window.__memoryOnly=true;
}
const S={
  async get(k,d=null){try{const r=await window.storage.get(k);return r&&r.value?JSON.parse(r.value):d}catch(e){return d}},

/* ============ 유틸 ============ */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const view=$('#view');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today=()=>new Date().toISOString().slice(0,10);
const normPhoto=p=>typeof p==='string'?{s:p,c:''}:{s:p.s,c:p.c||''};
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;$('#toast').appendChild(t);setTimeout(()=>t.remove(),2600);}
function fmtRange(a,b){if(!a)return'날짜 미정';const y=a.slice(0,4),m=+a.slice(5,7),d=+a.slice(8,10);
  if(!b||b===a)return`${y}.${m}.${d}일`;const m2=+b.slice(5,7),d2=+b.slice(8,10);
  return m===m2?`${y}.${m}.${d}~${d2}일`:`${y}.${m}.${d}~${m2}.${d2}일`;}
function days(a,b){if(!a||!b)return null;const d=(new Date(b)-new Date(a))/864e5;return isNaN(d)||d<0?null:Math.round(d)+1;}
function dayIndex(date){const t=trip();if(!t||!t.start)return null;const d=(new Date(date)-new Date(t.start))/864e5;return isNaN(d)||d<0?null:Math.round(d)+1;}
const ORD=['','첫날','둘째날','셋째날','넷째날','다섯째날','여섯째날','일곱째날','여덟째날','아홉째날','열째날'];
const ordinal=n=>n&&ORD[n]?ORD[n]:(n?n+'일차':'');
function dayLabel(s){const d=new Date(s+'T00:00:00');if(isNaN(d))return{dn:'--',wd:''};
  return{dn:String(d.getDate()).padStart(2,'0'),wd:(d.getMonth()+1)+'월 '+['일','월','화','수','목','금','토'][d.getDay()]+'요일'};}
const parseCourse=s=>String(s||'').split(/→|->|⇒|>>/).map(x=>x.trim()).filter(Boolean);
function hash(str){let h=0;for(let i=0;i<str.length;i++)h=(h*31+str.charCodeAt(i))|0;return Math.abs(h);}

/* ============ 상태 ============ */
const state={tripId:null,tab:'pages',trips:[],entries:[],places:[],filter:'all',pickMode:false,edit:false,sel:null,photoCache:{}};
const trip=()=>state.trips.find(t=>t.id===state.tripId);
async function loadTrips(){state.trips=await S.get(K.trips,[]);}
async function loadTrip(id){
  state.tripId=id;state.photoCache={};
  state.entries=await S.get(K.entries(id),[]);
  state.places=await S.get(K.places(id),[]);
  state.entries.sort((a,b)=>(a.date||'').localeCompare(b.date||''));
}
async function photosOf(entryId){
  if(!state.photoCache[entryId]) state.photoCache[entryId]=(await S.get(K.photos(entryId),[])).map(normPhoto);
  return state.photoCache[entryId];
}

/* ============ 홈 ============ */
function renderHome(){
  state.tripId=null;state.edit=false;hideBar();document.body.classList.add('home');
  const list=[...state.trips].sort((a,b)=>(b.start||'').localeCompare(a.start||''));
  const groups=[];
  list.forEach(t=>{
    const y=(t.start||'').slice(0,4)||'날짜 미정';
    let g=groups.find(x=>x.year===y);
    if(!g){ g={year:y,items:[]}; groups.push(g); }
    g.items.push(t);
  });
  const card=t=>{
    const th=(t.covers||[]).slice(0,2);
    return `<button class="trip-card" data-act="open" data-id="${t.id}">
      <div class="mini-cover">${th.length?th.map(s=>`<img src="${s}" alt="">`).join(''):'<div class="noimg">사진을 넣으면 표지가 채워집니다</div>'}</div>
      <div class="trip-body"><h3>${esc(t.title)}</h3>
      <div class="trip-meta">${fmtRange(t.start,t.end)}${t.region?' · '+esc(t.region):''}</div>
      <div class="trip-stats"><span class="pillstat">기록 ${t.entryCount||0}</span><span class="pillstat">장소 ${t.placeCount||0}</span>${days(t.start,t.end)?`<span class="pillstat">${days(t.start,t.end)}일</span>`:''}</div>
    </div></button>`;
  };
  view.innerHTML=`<div class="hero"><img src="${HERO}" alt="Memory of Family — 함께한 순간들이 우리의 가장 소중한 추억이 됩니다"></div>
    <p class="eyebrow">기록한 여행 ${list.length}</p>
    ${list.length?groups.map(g=>`<section class="yeargroup">
        <h2 class="yearhead">${g.year==='날짜 미정'?'날짜 미정':g.year+'년'}<span>${g.items.length}</span></h2>
        <div class="trip-grid">${g.items.map(card).join('')}</div>
      </section>`).join('')
    :`<div class="empty"><strong>첫 여행일지를 시작해 보세요</strong><p>표지에 제목과 함께한 사람을 적고, 하루마다 사진과 이야기를 남기면 지면으로 배치됩니다.</p><button class="btn" data-act="new-trip">여행 추가</button></div>`}
    <button class="btn fab" data-act="new-trip">+ 여행 추가</button>`;
  $('#footnote').textContent = window.__memoryOnly ? '이 창을 새로 고치면 기록이 사라집니다.'
    : window.__deviceStore ? '기록은 이 기기에 저장됩니다. 기기를 바꾸거나 브라우저 기록을 지우기 전에 데이터 메뉴에서 백업해 두세요.'
    : '기록은 자동 저장됩니다. 데이터 메뉴에서 백업할 수 있습니다.';
}

/* ============ 여행 화면 ============ */
function renderTrip(){
  const t=trip(); if(!t){renderHome();return;}
  document.body.classList.remove('home');
  view.innerHTML=`<button class="backlink" data-act="home">← 여행 목록</button>
    <div class="head-actions">
      <button class="btn sm" data-act="new-entry">하루 기록 추가</button>
      <button class="btn ghost sm" data-act="new-place">장소 추가</button>
      <button class="btn ghost sm" data-act="edit-trip">표지·서문 수정</button>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-act="tab" data-tab="pages" aria-selected="${state.tab==='pages'}">지면</button>
      <button class="tab" role="tab" data-act="tab" data-tab="timeline" aria-selected="${state.tab==='timeline'}">여정</button>
      <button class="tab" role="tab" data-act="tab" data-tab="map" aria-selected="${state.tab==='map'}">지도</button>
      <button class="tab" role="tab" data-act="tab" data-tab="places" aria-selected="${state.tab==='places'}">장소 ${state.places.length||''}</button>
    </div><div id="tabpanel"></div>`;
  renderTab();
  $('#footnote').textContent='기록은 자동 저장됩니다.';
}
function renderTab(){
  const p=$('#tabpanel'); if(!p) return;
  hideBar(); state.sel=null;
  if(state.tab==='pages') renderPages();
  else if(state.tab==='timeline') p.innerHTML=timelineHTML();
  else if(state.tab==='places') p.innerHTML=placesHTML();
  else{ p.innerHTML=`<div class="map-bar">
      <button class="btn ghost sm" data-act="pick" aria-pressed="${state.pickMode}">${state.pickMode?'선택 중 · 지도를 누르세요':'지도를 눌러 장소 추가'}</button>
      <button class="btn ghost sm" data-act="new-place">직접 입력</button></div>
    <div id="map"></div><p class="map-note" id="mapnote"></p>`; mountMap(); }
}

/* ============================================================
   지면(페이지) — 자동 배치 + 자유 배치
============================================================ */
const PAGE_RATIO=1.414;            // 세로/가로
const M={l:6,r:6,t:6,b:7};         // 여백 %
function pctH(wPct,aspect){ return wPct*aspect/PAGE_RATIO; }   // 사진 높이(페이지 높이 %)
function textH(len,wPct,em){       // 글 높이 추정(%)
  const perLine=Math.max(6,wPct/em*0.95);
  const lines=Math.max(1,Math.ceil(len/perLine));
  return lines*(em*2.6);
}
function measure(src){
  return new Promise(res=>{const i=new Image();i.onload=()=>res(i.naturalWidth/i.naturalHeight||1.4);i.onerror=()=>res(1.4);i.src=src;});
}
/* 자동 배치: 두 단으로 흘리되 사진마다 기울기를 준다 */
function autoLayout(entry,photos,ratios){
  const seed=hash(entry.id);
  const blocks=[];
  blocks.push({k:'title',h:9});
  if((entry.course||[]).length) blocks.push({k:'course',h:6+Math.ceil(entry.course.length/2)*3});
  (entry.body||'').split(/\n{2,}/).map(s=>s.trim()).filter(Boolean).forEach((t,i)=>blocks.push({k:'t'+i,len:t.length}));
  photos.forEach((p,i)=>blocks.push({k:'p'+i,aspect:ratios[i]||1.4,cap:(p.c||'').length}));
  // 사진과 글을 번갈아 섞어 지면이 고르게
  const texts=blocks.filter(b=>/^t\d+$/.test(b.k)), pics=blocks.filter(b=>/^p\d+$/.test(b.k));
  const head=blocks.filter(b=>b.k==='title'||b.k==='course');
  const mixed=[]; let ti=0,pi=0;
  while(ti<texts.length||pi<pics.length){
    if(pi<pics.length) mixed.push(pics[pi++]);
    if(pi<pics.length&&pics.length>texts.length*1.6) mixed.push(pics[pi++]);
    if(ti<texts.length) mixed.push(texts[ti++]);
  }
  const pages=[]; let items=[], col=[M.t,M.t], first=true;
  const colX=[M.l,50+1];
  const colW=[100-M.l-M.r-52, 0];
  function newPage(){ if(items.length) pages.push(items); items=[]; col=[M.t,M.t]; first=false; }
  // 머리(제목·코스)는 첫 페이지 상단 전체 폭
  head.forEach(b=>{
    items.push({id:uid(),k:b.k,x:M.l,y:col[0],w:100-M.l-M.r,rot:0});
    col[0]+=b.h+1.6; col[1]=col[0];
  });
  let idx=0;
  for(const b of mixed){
    const c = col[0]<=col[1]?0:1;
    const wBase = /^p\d+$/.test(b.k) ? [46,52,44,50][ (seed+idx)%4 ] : [40,44,42,38][ (seed+idx*3)%4 ];
    const w=Math.min(wBase, 52);
    const x = (c===0? M.l : 100-M.r-w) + (((seed+idx*7)%5)-2)*0.6;
    let h;
    if(b.k[0]==='p'){ h=pctH(w,1/b.aspect)+(b.cap?textH(b.cap,w,.56)+1.4:0)+1.2; }
    else{ h=textH(b.len,w,.66)+1.6; }
    if(col[c]+h > 100-M.b){
      if(col[0]>100-M.b-6 && col[1]>100-M.b-6){ newPage(); }
      else { /* 다른 단으로 */ }
    }
    const cc = col[0]<=col[1]?0:1;
    if(col[cc]+h > 100-M.b){ newPage(); }
    const c2 = col[0]<=col[1]?0:1;
    const x2 = Math.max(M.l-2, Math.min(100-M.r-w+2,
      (c2===0? M.l : 100-M.r-w) + (((seed+idx*7)%5)-2)*0.5));
    const rot = b.k[0]==='p' ? (((seed+idx*13)%9)-4)*0.9 : 0;
    items.push({id:uid(),k:b.k,x:+x2.toFixed(2),y:+col[c2].toFixed(2),w:+w.toFixed(2),rot:+rot.toFixed(2)});
    col[c2]+=h+2.2;
    idx++;
  }
  if(items.length) pages.push(items);
  return pages;
}

let drag=null;
function selectItem(item,page){

document.addEventListener('pointerdown',ev=>{
  if(!state.edit||state.tab!=='pages') return;
  const item=ev.target.closest('.pitem'); if(!item) return;
  const page=item.closest('.page'); if(!page||!page.dataset.entry) return;
  ev.preventDefault();
  const handle=ev.target.closest('.phandle');
  const mode=handle?handle.dataset.h:'move';
  if(!handle) selectItem(item,page);
  else if(!item.classList.contains('sel')) selectItem(item,page);
  const r=page.getBoundingClientRect(), ir=item.getBoundingClientRect();
  const o={x:parseFloat(item.style.left)||0,y:parseFloat(item.style.top)||0,
           w:parseFloat(item.style.width)||30,
           rot:parseFloat((item.style.transform.match(/-?[\d.]+/)||[0])[0])||0};
  drag={item,page,r,mode,o,cur:{...o},
        sx:ev.clientX,sy:ev.clientY,
        cx:ir.left+ir.width/2, cy:ir.top+ir.height/2,
        a0:Math.atan2(ev.clientY-(ir.top+ir.height/2), ev.clientX-(ir.left+ir.width/2))};
  try{ (handle||item).setPointerCapture(ev.pointerId); }catch(e){}
});
document.addEventListener('pointermove',ev=>{
  if(!drag) return;
  const {item,r,cur,o,mode}=drag;
  if(mode==='move'){
    const dx=(ev.clientX-drag.sx)/r.width*100, dy=(ev.clientY-drag.sy)/r.height*100;
    cur.x=Math.max(-8,Math.min(100,o.x+dx));
    cur.y=Math.max(-6,Math.min(100,o.y+dy));
    item.style.left=cur.x.toFixed(2)+'%'; item.style.top=cur.y.toFixed(2)+'%';
  }else if(mode==='size'){
    const dx=(ev.clientX-drag.sx)/r.width*100;
    cur.w=Math.max(8,Math.min(96,o.w+dx*1.7));
    item.style.width=cur.w.toFixed(2)+'%';
  }else{
    const a=Math.atan2(ev.clientY-drag.cy,ev.clientX-drag.cx);
    cur.rot=o.rot+(a-drag.a0)*180/Math.PI;
    item.style.transform=`rotate(${cur.rot.toFixed(1)}deg)`;
  }
});
document.addEventListener('pointerup',async ()=>{
  if(!drag) return;
  const it=findItem(drag.page.dataset.entry,+drag.page.dataset.page,drag.item.dataset.id);
  if(it){
    it.x=+drag.cur.x.toFixed(2); it.y=+drag.cur.y.toFixed(2);
    it.w=+drag.cur.w.toFixed(2); it.rot=+drag.cur.rot.toFixed(1);
    await saveLayout();
  }
  drag=null;
});

async function itemOp(op){

  if(op==='done'){ state.sel=null; hideBar(); $$('.pitem.sel').forEach(x=>x.classList.remove('sel')); return; }
  const e=state.entries.find(x=>x.id===state.sel.entryId); if(!e||!e.layout) return;
  const pg=e.layout[state.sel.pageIdx]; if(!pg) return;
  const idx=pg.findIndex(i=>i.id===state.sel.id); if(idx<0) return;
  const it=pg[idx];

  // 지면 사이 이동 / 복사 / 빼기 — 다시 그린다
  if(op==='pgup'||op==='pgdn'||op==='copy'||op==='del'){
    if(op==='del'){
      pg.splice(idx,1);
      if(!e.layout.length||e.layout.every(p=>!p.length)) e.layout=[[]];
      state.sel=null; hideBar();
      toast('지면에서 뺐습니다. 사진 자체는 남아 있습니다.');
    }else if(op==='copy'){
      const copy=Object.assign({},it,{id:uid(),x:Math.min(88,it.x+4),y:Math.min(88,it.y+4)});
      pg.push(copy); state.sel={...state.sel,id:copy.id};
      toast('같은 지면에 복사했습니다. 앞/뒤 지면 버튼으로 옮길 수 있어요.');
    }else{
      const dir=op==='pgup'?-1:1;
      let target=state.sel.pageIdx+dir;
      if(target<0){ toast('이 날짜의 첫 지면입니다.'); return; }
      if(target>=e.layout.length){
        if(op==='pgdn'){ e.layout.push([]); }
        else return;
      }
      pg.splice(idx,1);
      e.layout[target].push(it);
      e.layout=e.layout.filter((p,i)=>p.length||i<=target);
      state.sel={entryId:e.id,pageIdx:target,id:it.id};
      toast(dir<0?'앞 지면으로 옮겼습니다.':'뒤 지면으로 옮겼습니다.');
    }
    await saveLayout();
    await renderPages();
    if(state.sel){
      const el=[...$$('#pagewrap .page')].find(p=>p.dataset.entry===state.sel.entryId&&+p.dataset.page===state.sel.pageIdx)
        ?.querySelector(`.pitem[data-id="${state.sel.id}"]`);

    }

  }

  if(op==='w-') it.w=Math.max(12,+(it.w-4).toFixed(1));
  if(op==='r0') it.rot=0;
  if(op==='front') it.z=Math.max(0,...pg.map(i=>i.z||0))+1;
  const el=[...$$('#pagewrap .page')].find(p=>p.dataset.entry===state.sel.entryId&&+p.dataset.page===state.sel.pageIdx)
            ?.querySelector(`.pitem[data-id="${state.sel.id}"]`);
  if(el){ el.style.width=it.w+'%'; el.style.transform=`rotate(${it.rot||0}deg)`; if(it.z) el.style.zIndex=it.z; }
  await saveLayout();
}

  if(!pts.length){box.outerHTML=`<div class="empty"><strong>지도에 표시할 장소가 없습니다</strong><p>장소에 위치를 넣으면 다녀온 자리가 찍힙니다.</p><button class="btn" data-act="new-place">장소 추가</button></div>`;return;}
  if(!await loadLeaflet()){box.outerHTML=fallbackMap(pts);const n=$('#mapnote');if(n)n.textContent='지도를 불러오지 못해 좌표 배치도로 표시했습니다.';return;}
  if(mapObj){mapObj.remove();mapObj=null;}
  mapObj=L.map('map',{scrollWheelZoom:false});tileFails=0;
  const layer=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'});
  layer.on('tileerror',()=>{if(++tileFails===4){const n=$('#mapnote');if(n)n.textContent='지도 배경을 불러오지 못했지만 위치는 정확합니다.';}});
  layer.addTo(mapObj);
  const g=[];
  pts.forEach(p=>{const icon=L.divIcon({html:`<div class="pin" style="background:${CATS[p.cat].hex}"></div>`,className:'',iconSize:[20,20],iconAnchor:[10,18]});
    L.marker([p.lat,p.lng],{icon}).addTo(mapObj).bindPopup(`<b>${esc(p.name)}</b><br>${CATS[p.cat].label}${p.note?'<br>'+esc(p.note):''}`);g.push([p.lat,p.lng]);});
  mapObj.fitBounds(L.latLngBounds(g).pad(.25),{maxZoom:14});
  mapObj.on('click',ev=>{if(!state.pickMode)return;state.pickMode=false;openPlaceSheet(null,{lat:+ev.latlng.lat.toFixed(5),lng:+ev.latlng.lng.toFixed(5)});});
  const n=$('#mapnote'); if(n&&!n.textContent) n.textContent='핀 색은 분류를 뜻합니다 — 명소·맛집·숙소·카페·기타.';
}
function fallbackMap(pts){
  const la=pts.map(p=>p.lat),ln=pts.map(p=>p.lng);
  let mnLa=Math.min(...la),mxLa=Math.max(...la),mnLn=Math.min(...ln),mxLn=Math.max(...ln);
  const py=Math.max((mxLa-mnLa)*.25,.02),px=Math.max((mxLn-mnLn)*.25,.02);
  mnLa-=py;mxLa+=py;mnLn-=px;mxLn+=px;
  const W=760,H=420,x=v=>((v-mnLn)/(mxLn-mnLn))*(W-70)+40,y=v=>H-40-((v-mnLa)/(mxLa-mnLa))*(H-70);
  let g='';
  for(let i=0;i<=4;i++){const gx=40+i*(W-70)/4,gy=H-40-i*(H-70)/4;
    g+=`<line x1="${gx}" y1="20" x2="${gx}" y2="${H-40}" stroke="var(--line-soft)"/><line x1="40" y1="${gy}" x2="${W-30}" y2="${gy}" stroke="var(--line-soft)"/>`;
    g+=`<text x="${gx+3}" y="${H-26}">${(mnLn+(mxLn-mnLn)*i/4).toFixed(2)}</text><text x="4" y="${gy-3}">${(mnLa+(mxLa-mnLa)*i/4).toFixed(2)}</text>`;}
  return `<svg class="fallmap" viewBox="0 0 ${W} ${H}">${g}${pts.map(p=>`<g><circle cx="${x(p.lng)}" cy="${y(p.lat)}" r="6" fill="${CATS[p.cat].hex}" stroke="#fff" stroke-width="2"/><text x="${x(p.lng)+10}" y="${y(p.lat)+3}" style="font-size:11px;fill:var(--ink)">${esc(p.name)}</text></g>`).join('')}</svg>`;
}

function readImage(file,max,q){return new Promise((res,rej)=>{const fr=new FileReader();
  fr.onload=()=>{const img=new Image();img.onload=()=>{const sc=Math.min(1,max/Math.max(img.width,img.height));
    const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q));};
    img.onerror=()=>rej(0);img.src=fr.result;};fr.onerror=()=>rej(0);fr.readAsDataURL(file);});}
function shrink(u,size,q){return new Promise(res=>{const img=new Image();
  img.onload=()=>{const sc=Math.min(1,size/Math.max(img.width,img.height));const c=document.createElement('canvas');
    c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    res(c.toDataURL('image/jpeg',q));};img.onerror=()=>res('');img.src=u;});}

async function exportAll(){

  for(const t of state.trips){
    const entries=await S.get(K.entries(t.id),[]),places=await S.get(K.places(t.id),[]),photos={};
    for(const e of entries) if(e.photoCount) photos[e.id]=await S.get(K.photos(e.id),[]);

async function onImport(ev){
  const f=ev.target.files[0]; ev.target.value=''; if(!f)return;
  try{
    const raw=JSON.parse(await f.text()); if(!raw.trips) throw 0;
    if(!confirm('백업의 여행을 현재 목록에 더합니다. 계속할까요?'))return;
    for(const t of raw.trips){
      const nid=uid(),d=raw.data[t.id]||{entries:[],places:[],photos:{}},map={};
      const entries=(d.entries||[]).map(e=>{const ni=uid();map[e.id]=ni;return{...e,id:ni};});
      await S.set(K.entries(nid),entries); await S.set(K.places(nid),d.places||[]);
      for(const [oid,ph] of Object.entries(d.photos||{})) if(map[oid]) await S.set(K.photos(map[oid]),ph);
      state.trips.push({...t,id:nid});
    }
    await S.set(K.trips,state.trips); closeSheet(); renderHome(); toast('백업을 불러왔습니다.');
  }catch(e){ toast('파일을 읽지 못했습니다. 이 앱에서 내보낸 백업인지 확인해 주세요.'); }
}

    case 'it': await itemOp(el.dataset.op); break;
    case 'print': window.print(); break;
    case 'pick': state.pickMode=!state.pickMode; el.setAttribute('aria-pressed',state.pickMode);
      el.textContent=state.pickMode?'선택 중 · 지도를 누르세요':'지도를 눌러 장소 추가'; break;
    case 'new-trip': openTripSheet(null); break;
    case 'edit-trip': openTripSheet(trip()); break;
    case 'save-trip': await saveTrip(id); break;
    case 'del-trip': await deleteTrip(); break;
    case 'new-entry': openEntrySheet(null); break;
    case 'edit-entry': openEntrySheet(state.entries.find(e=>e.id===id)); break;
    case 'save-entry': await saveEntry(id); break;
    case 'del-entry': await delEntry(id); break;
    case 'new-place': openPlaceSheet(null); break;
    case 'edit-place': openPlaceSheet(state.places.find(p=>p.id===id)); break;
    case 'save-place': await savePlace(id); break;
    case 'del-place': await delPlace(id); break;
    case 'open-photos': openPhotos(id,+(el.dataset.i||0)); break;
    case 'opt': {const was=el.getAttribute('aria-pressed')==='true',g=el.dataset.group;
      el.closest('.opts').querySelectorAll('.opt').forEach(b=>b.setAttribute('aria-pressed','false'));
      el.setAttribute('aria-pressed',was&&g!=='cat'?'false':'true'); break;}
    case 'optmulti': el.setAttribute('aria-pressed',el.getAttribute('aria-pressed')==='true'?'false':'true'); break;
    case 'rmphoto': captureCaptions(); workPhotos.splice(+el.dataset.i,1); drawPreviews(); break;
    case 'cancel': closeSheet(); break;
    case 'overlay': if(ev.target===el) closeSheet(); break;
    case 'menu': openDataSheet(); break;
    case 'export': await exportAll(); break;
    case 'lb-close': closeLB(); break;
    case 'lb-bg': if(ev.target===el) closeLB(); break;
    case 'lb-prev': lbIdx=(lbIdx-1+lbPhotos.length)%lbPhotos.length; drawLB(); break;
    case 'lb-next': lbIdx=(lbIdx+1)%lbPhotos.length; drawLB(); break;
  }
});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'){ if(lbPhotos.length) closeLB(); else closeSheet(); }
  if(lbPhotos.length>1){
    if(ev.key==='ArrowLeft'){lbIdx=(lbIdx-1+lbPhotos.length)%lbPhotos.length;drawLB();}
    if(ev.key==='ArrowRight'){lbIdx=(lbIdx+1)%lbPhotos.length;drawLB();}
  }
});

(async function init(){
  view.innerHTML='<p class="eyebrow">불러오는 중</p>';
  await loadTrips(); renderHome();
})();
</script>
